[project]
name = "scribeflow"
version = "0.2.0"
description = "扫描版 PDF 转章节 Markdown：MinerU 本地 OCR + 块级保真清洗"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.70,<3",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
# OCR 引擎。桌面应用和实际转换需要它；开发和测试不需要。
ocr = ["mineru[all]==3.4.4"]

[project.scripts]
scribeflow = "scribeflow.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribeflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "packaging"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 中文全角标点是有意为之

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/scribeflow"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "openai.*"]
ignore_missing_imports = true
